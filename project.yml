name: GymTracker

options:
  bundleIdPrefix: com.3dayg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L33VS9D78T

targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - GymTracker
    info:
      path: GymTracker/Info.plist
      properties:
        CFBundleDisplayName: Gym Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.3dayg.gymtracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GymTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GymTrackerTests
    dependencies:
      - target: GymTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.3dayg.gymtracker.tests
        GENERATE_INFOPLIST_FILE: YES

  GymTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GymTrackerUITests
    dependencies:
      - target: GymTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.3dayg.gymtracker.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GymTracker

schemes:
  GymTracker:
    build:
      targets:
        GymTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GymTrackerTests
        - GymTrackerUITests
